# Builds the Zephyrus Android app (APK) on GitHub's servers every time the code is pushed,
# and publishes it on the repository's "latest" release page for download to the phone.
name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the phone engine matches the laptop engine
        run: |
          set -o pipefail
          { pip install -q -r requirements.txt &&
            python android/tests/make_reference.py "$RUNNER_TEMP/parity" &&
            node android/tests/parity.test.js "$RUNNER_TEMP/parity"; } 2>&1 | tee "$RUNNER_TEMP/parity.log" || {
            echo "::error title=Parity check failed::$(tail -20 "$RUNNER_TEMP/parity.log" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > "$RUNNER_TEMP/sdk.log" 2>&1 || {
            echo "::error title=Android SDK install failed::$(tail -20 "$RUNNER_TEMP/sdk.log" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            msg=$(grep -E -A4 "error:|What went wrong|^e: |Could not|FAILED" "$RUNNER_TEMP/gradle.log" | grep -v "^\s*at " | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"; exit 1; }

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Zephyrus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zephyrus-apk
          path: Zephyrus.apk

      - name: Publish on the "latest" release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zephyrus for Android (latest build)
          body: |
            On the Android phone: open this page, tap **Zephyrus.apk**, then allow your browser to install apps when asked.
            Each new build installs over the previous one; your saved wind data is kept.
          files: Zephyrus.apk
          make_latest: true
